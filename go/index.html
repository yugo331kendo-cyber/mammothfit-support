  <head>
    <meta charset="utf-8" />

    <meta name="description" content="MammothFit: 挙げた重さの合計が動物の群れになる筋トレ記録アプリ。広告なし、アカウント不要。App Storeで入手。" />
    <meta name="theme-color" content="#070809" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-itunes-app" content="app-id=6787899611" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="canonical" href="https://yugo331kendo-cyber.github.io/mammothfit-support/go/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MammothFit — 1キロが、群れになる" />
    <meta property="og:description" content="挙げた重さの合計が、そのまま群れになる筋トレ記録アプリ。" />
    <meta property="og:url" content="https://yugo331kendo-cyber.github.io/mammothfit-support/go/" />
    <meta property="og:image" content="https://yugo331kendo-cyber.github.io/mammothfit-support/go/shots/ja_06_sharecard.webp" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <style>html,body{background:#070809;margin:0;min-height:100%}</style>
  </head>
  <body class="bg-void text-fg">
    <div id="root"></div>
    <script type="module">
      const BASE = "/mammothfit-support/go/";
      const cat = async (paths) =>
        (await Promise.all(paths.map((p) => fetch(BASE + p).then((r) => {
          if (!r.ok) throw new Error(p + " " + r.status);
          return r.text();
        })))).join("");
      const blobUrl = (b64, mime) => {
        const bin = atob(b64);
        const arr = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        return URL.createObjectURL(new Blob([arr], { type: mime }));
      };
      const manifest = await fetch(BASE + "boot-manifest.json").then((r) => r.json());
      const css = await cat(manifest.cssParts);
      const style = document.createElement("style");
      style.textContent = css;
      document.head.appendChild(style);
      const mf = {};
      await Promise.all(
        Object.entries(manifest.images).map(async ([key, { parts, mime }]) => {
          mf[key] = blobUrl(await cat(parts), mime);
        }),
      );
      globalThis.__MF = mf;
      const src = await cat(manifest.jsParts);
      const url = URL.createObjectURL(new Blob([src], { type: "text/javascript" }));
      await import(url);
    </script>
  </body>
</html>
